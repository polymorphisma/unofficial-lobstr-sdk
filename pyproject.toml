[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobstr-sdk"
version = "0.1.0"
description = "A Python SDK for Lobstr.io - The easiest way to scrape."
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
"Homepage" = "https://github.com/polymorphisma/unofficial-lobstr-sdk"
"Bug Tracker" = "https://github.com/polymorphisma/unofficial-lobstr-sdk/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/lobstr"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
